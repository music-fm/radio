<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Webplayer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        color: white;
        text-align: center;
        padding-top: 50px;
    }

    .player {
        width: 350px;
        margin: auto;
        background: #2b2b2b;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    button {
        background: #ff6600;
        border: none;
        color: white;
        padding: 12px 20px;
        margin-top: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #e55c00;
    }

    h2 {
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="player">
    <h2>🎵 Mijn Radio</h2>

    <audio id="radioPlayer" preload="none">
        <source src="http://uk16freenew.listen2myradio.com:10001" type="audio/mpeg">
        Je browser ondersteunt geen audio.
    </audio>

    <button onclick="toggleRadio()">▶ Afspelen</button>
</div>

<script>
const player = document.getElementById('radioPlayer');
const button = document.querySelector('button');

function toggleRadio() {
    if (player.paused) {
        player.play();
        button.textContent = '⏸ Pauzeren';
    } else {
        player.pause();
        button.textContent = '▶ Afspelen';
    }
}
</script>

</body>
</html>
